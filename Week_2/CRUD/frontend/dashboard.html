<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">

    <nav class="bg-white shadow-md p-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-blue-600">🚀 Career Launchpad</h1>
        <button onclick="logout()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg">Logout</button>
    </nav>

    <div class="container mx-auto mt-10 p-6">
        <div class="bg-white p-8 rounded-lg shadow-lg text-center">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">Welcome to Dashboard!</h2>
            <p class="text-gray-600 text-lg">You have successfully authenticated.</p>
            <div id="userInfo" class="mt-6 p-4 bg-blue-50 text-blue-700 rounded-lg inline-block">
                Loading user data...
            </div>
        </div>
    </div>

    <script>
        // Check if user is logged in
        const token = localStorage.getItem('token');
        if (!token) {
            window.location.href = 'index.html'; // Kick out if no token
        }

        // Show simplified user info
        document.getElementById('userInfo').innerText = "You are securely logged in.";

        function logout() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
